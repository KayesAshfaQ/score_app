name: Flutter Analyze & Debug Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java17-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/**/gradle-wrapper.properties', 'android/**/gradle.lockfile', 'pubspec.lock', 'packages/shared/pubspec.yaml') }}

      # pubspec.yaml bundles .env, which is intentionally not committed.
      # Use a non-secret placeholder so pull requests can build without secrets.
      - name: Create CI environment asset
        run: printf 'FOOTBALL_DATA_API_KEY=ci-placeholder\n' > .env

      - name: Install dependencies
        run: flutter pub get

      # functions/ is a separate backend package with its own Dart constraint.
      - name: Analyze Flutter app and shared library
        run: |
          flutter analyze --no-pub lib test
          flutter analyze --no-pub packages/shared/lib

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
