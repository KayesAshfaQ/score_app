name: Flutter Android Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-java17-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/**/gradle-wrapper.properties', 'android/**/gradle.lockfile', 'pubspec.lock', 'packages/shared/pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      # functions/ is a separate backend package with its own Dart constraint.
      - name: Analyze Flutter app and shared library
        run: |
          flutter analyze --no-pub lib test
          flutter analyze --no-pub packages/shared/lib

      # Configure these five repository secrets before running this workflow.
      # The keystore must match the app's existing upload/signing identity.
      - name: Restore release signing and environment files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          required = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_PASSWORD", "ANDROID_KEY_ALIAS", "FOOTBALL_DATA_API_KEY",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("::error::Missing repository secrets: " + ", ".join(missing))

          try:
              keystore = base64.b64decode(
                  "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True
              )
          except (ValueError, binascii.Error):
              raise SystemExit("::error::ANDROID_KEYSTORE_BASE64 must contain a base64-encoded keystore")
          if not keystore:
              raise SystemExit("::error::Decoded Android keystore is empty")

          api_key = os.environ["FOOTBALL_DATA_API_KEY"]
          if any(char in api_key for char in "\r\n"):
              raise SystemExit("::error::FOOTBALL_DATA_API_KEY must be a single line")

          # Java Properties uses ISO-8859-1; Unicode escapes preserve all secret characters.
          def property_value(value):
              encoded = value.encode("utf-16-be")
              return "".join(
                  "\\u" + encoded[index:index + 2].hex()
                  for index in range(0, len(encoded), 2)
              )

          os.umask(0o077)
          Path("android/app/release.jks").write_bytes(keystore)
          properties = {
              "storeFile": "release.jks",  # Relative to android/app/ in Gradle.
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
          }
          Path("android/key.properties").write_text(
              "".join(f"{name}={property_value(value)}\n" for name, value in properties.items()),
              encoding="ascii",
          )
          Path(".env").write_text(f"FOOTBALL_DATA_API_KEY={api_key}\n", encoding="utf-8")
          PY

      - name: Build release AAB
        run: flutter build appbundle --release --no-pub

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing and environment files
        if: always()
        run: rm -f android/key.properties android/app/release.jks .env
